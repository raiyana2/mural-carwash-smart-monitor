# Dev broker config. For the Pi: sudo apt install mosquitto, then copy this to
# /etc/mosquitto/conf.d/carwash.conf. Turn on auth before using a shared network.
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/

# Production-ish:
# allow_anonymous false
# password_file /etc/mosquitto/passwd     # create with: mosquitto_passwd -c /etc/mosquitto/passwd backend

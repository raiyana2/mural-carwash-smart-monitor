; PlatformIO project for the ESP32 firmware. Press Upload in VS Code, or run:
;   pio run -t upload
; The firmware is firmware/motor_rain_controller/src/main.cpp, with its pins and
; limits in firmware/motor_rain_controller/config.h. (The .ino next to them is an
; empty entry point so the same code also opens in the Arduino IDE.)
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = firmware/motor_rain_controller/src

[env:adafruit_feather_esp32_v2]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    madhephaestus/ESP32Servo@^3.0.5

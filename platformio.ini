; PlatformIO project for the ESP32 firmware. Press Upload in VS Code, or run:
;   pio run -t upload
; The firmware itself is firmware/motor_rain_controller/ (one sketch that also
; opens in the Arduino IDE). https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = firmware/motor_rain_controller

[env:adafruit_feather_esp32_v2]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    madhephaestus/ESP32Servo@^3.0.5
